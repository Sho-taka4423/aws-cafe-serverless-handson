<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS Cafe 開店カウントダウン</title>
<style>
:root { --bg: #2b1d14; --ink: #fbefe1; --accent: #e0a96d; --muted: #c8b29b; --ng: #ff8a7a; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #4a3324, var(--bg)); color: var(--ink);
  font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
h1 { font-size: clamp(1.4rem, 4vw, 3rem); margin: 0; }
.label { font-size: clamp(1.2rem, 3.5vw, 2.4rem); color: var(--muted); margin-top: 3vh; }
#time { font-size: clamp(4rem, 22vw, 16rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent); }
#time.hurry { color: var(--ng); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
#quote { font-size: clamp(1rem, 2.6vw, 1.8rem); min-height: 2.4em; margin-top: 2vh; }
.ctrl { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; opacity: .25; transition: opacity .2s; }
.ctrl:hover, .ctrl:focus-within { opacity: 1; }
.ctrl input { width: 5em; padding: 6px; border-radius: 6px; border: 0; }
.ctrl button { padding: 6px 12px; border-radius: 6px; border: 0; background: var(--accent); color: var(--bg); font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <h1>☕ AWS Cafe 開店前トラブルを解決せよ！</h1>
  <div class="label" id="label">開店まであと</div>
  <div id="time">--:--</div>
  <div id="quote"></div>

  <div class="ctrl">
    <label>分 <input id="min" type="number" value="60" min="1" max="300"></label>
    <button id="start">スタート</button>
    <button id="pause">一時停止/再開</button>
    <button id="plus">+5分</button>
  </div>

<script>
// URL で開始時間を指定可能: countdown.html?min=60
const QUOTES = [
  "店長「お客様がもうすぐ来ちゃう…！」",
  "店長「困ったら、まずログを見てみて！」",
  "店長「伝票が届いてるか、厨房（DynamoDB）も確認してね」",
  "店長「直したら Deploy！ API もデプロイ！」",
  "バイトくん「困ったら店長のつぶやき（ヒント）を見てもいいんですよ…」",
  "店長「権限は必要な分だけ。全部許可はダメだよ！」",
];
let endAt = null, pausedLeft = null, timer = null;
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
if (q.get("min")) $("min").value = q.get("min");

function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(sec).padStart(2, "0");
}
function tick() {
  const left = pausedLeft ?? endAt - Date.now();
  $("time").textContent = fmt(left);
  $("time").classList.toggle("hurry", left <= 5 * 60 * 1000 && left > 0);
  if (left <= 0) {
    $("label").textContent = "";
    $("time").textContent = "開店！🎉";
    $("quote").textContent = "店長「みなさん、ありがとうございました！」";
    clearInterval(timer);
  }
}
function start(min) {
  endAt = Date.now() + min * 60 * 1000;
  pausedLeft = null;
  $("label").textContent = "開店まであと";
  clearInterval(timer);
  timer = setInterval(tick, 250);
  tick();
}
$("start").onclick = () => start(Number($("min").value) || 60);
$("pause").onclick = () => {
  if (endAt === null) return;
  if (pausedLeft === null) { pausedLeft = endAt - Date.now(); }
  else { endAt = Date.now() + pausedLeft; pausedLeft = null; }
  tick();
};
$("plus").onclick = () => {
  if (endAt === null) return;
  if (pausedLeft !== null) pausedLeft = Math.max(pausedLeft, 0) + 5 * 60 * 1000;
  else endAt = Math.max(endAt, Date.now()) + 5 * 60 * 1000;
  $("label").textContent = "開店まであと";
  clearInterval(timer);
  timer = setInterval(tick, 250);
  tick();
};
let qi = 0;
setInterval(() => { if (endAt && (pausedLeft ?? endAt - Date.now()) > 0) $("quote").textContent = QUOTES[qi++ % QUOTES.length]; }, 15000);
$("quote").textContent = QUOTES[0];
if (q.get("min")) start(Number(q.get("min")));
</script>
</body>
</html>
